# The reverse proxy on the host, in front of the app container (compose.yaml
# publishes it on 127.0.0.1:3000). Put it in /etc/nginx/conf.d/ or
# sites-available/ and add TLS, e.g. with certbot.
server {
    listen 80;
    server_name fahrtkosten.example.org;

    # The documents of an application are up to 18 MB in total, plus the
    # multipart overhead. Larger requests get nginx's own 413 page.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
